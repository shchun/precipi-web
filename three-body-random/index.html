<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>랜덤 3체 관찰기</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K7BBKNKZYM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-K7BBKNKZYM');
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <canvas id="scene" aria-label="랜덤 3체 중력 시뮬레이션"></canvas>

      <header class="topTitle">
        <h1>랜덤 3체 관찰기</h1>
        <p id="subtitle">시드 기반 2D Newtonian gravity</p>
      </header>

      <button id="spaceSound" class="soundButton" type="button" title="우주소음 켜기">소리 켜기</button>

      <section class="hud collapsed" aria-label="시뮬레이션 컨트롤">
        <header class="hudHeader">
          <button id="togglePanel" class="settingsButton" type="button" title="설정 열기">설정</button>
        </header>

        <div id="panelBody" class="panelBody">
          <div class="buttonGrid">
            <button id="playPause" type="button">일시정지</button>
            <button id="newSystem" type="button">새 3체</button>
            <button id="resetSeed" type="button">재시작</button>
          </div>

          <label class="field">
            <span>프리셋</span>
            <select id="preset">
              <option value="random">랜덤 검증</option>
              <option value="figure8">Figure-eight</option>
              <option value="lagrange">Lagrange 삼각형</option>
              <option value="binaryOuter">근쌍성 + 외곽체</option>
            </select>
          </label>

          <div class="presetNote" id="presetNote"></div>

          <label class="field">
            <span>시드</span>
            <input id="seedInput" type="text" spellcheck="false" autocomplete="off" />
          </label>

          <label class="range">
            <span>시간 배율 <b id="speedValue">0.1x</b></span>
            <input id="speed" type="range" min="0.01" max="4" step="0.01" value="0.1" />
          </label>

          <label class="range">
            <span>중력 상수 <b id="gravityValue">1.00</b></span>
            <input id="gravity" type="range" min="0.25" max="2.5" step="0.05" value="1" />
          </label>

          <label class="range">
            <span>꼬리 길이 <b id="trailValue">2000</b></span>
            <input id="trailLength" type="range" min="120" max="8000" step="20" value="2000" />
          </label>

          <div class="checks">
            <label><input id="autoFrame" type="checkbox" checked /> 자동 프레이밍</label>
            <label><input id="showVectors" type="checkbox" checked /> 속도 벡터</label>
            <label><input id="fadeTrails" type="checkbox" checked /> 잔상 페이드</label>
          </div>

          <dl class="stats">
            <div>
              <dt>경과 시간</dt>
              <dd id="timeStat">0.0</dd>
            </div>
            <div>
              <dt>최소 거리</dt>
              <dd id="distanceStat">0.00</dd>
            </div>
            <div>
              <dt>에너지 변화</dt>
              <dd id="energyStat">0.00%</dd>
            </div>
          </dl>
        </div>
      </section>

      <aside class="rightPanels">
        <section class="skyPanel" aria-label="선택한 물체에서 본 하늘">
          <div class="panelTopline">
            <div>
              <div class="legendTitle">Observer Sky</div>
              <div class="panelCaption">전방 = 관측체의 속도 방향</div>
            </div>
            <label class="miniSelect">
              <span>관측</span>
              <select id="skyObserver">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C" selected>C</option>
              </select>
            </label>
          </div>
          <canvas id="skyView" width="680" height="300"></canvas>
          <div id="skyReadout" class="skyReadout"></div>
        </section>

        <section class="legend" aria-label="각 물체 상태">
          <div class="legendTitle">Bodies</div>
          <div class="legendGrid legendHead">
            <span></span>
            <span>질량</span>
            <span>속도</span>
            <span>중심거리</span>
          </div>
          <div id="bodyLegend"></div>
        </section>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
