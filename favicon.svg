<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="55%" stop-color="#764ba2"/>
      <stop offset="100%" stop-color="#5b8def"/>
    </linearGradient>
    <radialGradient id="dot" cx="32%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#7bd0ff"/>
      <stop offset="100%" stop-color="#4a90e2"/>
    </radialGradient>
  </defs>

  <!-- rounded badge background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>

  <!-- orbit ring -->
  <ellipse cx="32" cy="32" rx="20" ry="13" fill="none"
           stroke="rgba(255,255,255,0.55)" stroke-width="2"
           transform="rotate(-25 32 32)"/>

  <!-- planet -->
  <circle cx="32" cy="32" r="9" fill="rgba(255,255,255,0.95)"/>

  <!-- orbiting dot -->
  <circle cx="50" cy="22" r="4.5" fill="url(#dot)"/>
</svg>
