<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FCE3D2">
  <meta name="description" content="A minimal pomodoro timer with a warm pie-dial that steps down every ten seconds. Short (25/5) and long (50/10) focus sessions.">
  <title>Pomodoro Timer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='42' fill='%23FCE3D2'/><circle cx='96' cy='96' r='44' fill='%23FF5A1F'/><path d='M96 96 V48 A48 48 0 0 1 144 96 Z' fill='%23FF7A3D'/><circle cx='96' cy='96' r='14' fill='%23FFFDFB'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='42' fill='%23FCE3D2'/><circle cx='96' cy='96' r='44' fill='%23FF5A1F'/><path d='M96 96 V48 A48 48 0 0 1 144 96 Z' fill='%23FF7A3D'/><circle cx='96' cy='96' r='14' fill='%23FFFDFB'/></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* full-bleed screen */
    .screen {
      min-height: 100vh; width: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 48px;
      padding: 48px 26px;
      background: linear-gradient(180deg, #FFF1E6 0%, #FCE3D2 50%, #F6D3BC 100%);
      overflow: hidden;
    }

    /* header: mode chooser */
    .header { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .modes {
      display: flex; gap: 6px; padding: 6px; border-radius: 999px;
      background: rgba(255,255,255,.55);
      box-shadow: inset 0 0 0 1px rgba(178,120,70,.14), 0 6px 18px rgba(178,120,70,.07);
    }
    .pill {
      border: none; cursor: pointer; padding: 0 22px; height: 48px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center; white-space: nowrap;
      font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: .02em;
      color: rgba(120,72,40,.38);
      background: transparent; transition: all .2s ease;
    }
    .pill:not(.active) { opacity: .9; }
    .pill.active {
      background: #FFFDFB; color: #FF5A1F; font-weight: 700;
      box-shadow: 0 6px 16px -5px rgba(178,80,30,.5), inset 0 0 0 1px rgba(255,140,90,.22);
    }
    .pill-ico { display: block; }

    /* dial — aspect-ratio + no flex-shrink guarantee it stays a perfect circle
       even when a flex parent (e.g. the landscape row layout) tries to squeeze it. */
    .dial { position: relative; width: min(300px, 88vw); height: min(300px, 88vw); aspect-ratio: 1 / 1; flex-shrink: 0; margin-top: 28px; display: flex; align-items: center; justify-content: center; }
    /* tomato calyx sitting on top of the circle */
    .stem {
      position: absolute; top: -52px; left: 50%; transform: translateX(-50%);
      width: 110px; z-index: 4; pointer-events: none;   /* floats just above the dial — does not touch it */
      filter: drop-shadow(0 2px 2px rgba(60,90,30,.22));
    }
    .stem svg { display: block; width: 100%; height: auto; }
    .glow {
      position: absolute; inset: -46px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,138,74,.28) 0%, rgba(255,138,74,0) 68%);
      filter: blur(6px);
    }
    .ticks {
      position: absolute; inset: -14px; border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, rgba(154,91,48,.28) 0deg 0.7deg, transparent 0.7deg 6deg);
      /* % radii so the tick ring scales with the dial in any orientation */
      -webkit-mask: radial-gradient(circle, transparent 0 91.5%, #000 91.5% 96.3%, transparent 96.3%);
      mask: radial-gradient(circle, transparent 0 91.5%, #000 91.5% 96.3%, transparent 96.3%);
    }
    .pie {
      position: absolute; inset: 0; border-radius: 50%;
      transform: scaleX(-1);   /* mirror so the ring drains counter-clockwise from the top */
      box-shadow: 0 22px 54px -14px rgba(178,80,30,.45), inset 0 0 0 1px rgba(255,255,255,.45);
    }
    .hub {
      position: relative; width: 78px; height: 78px; border-radius: 50%; background: #FFFDFB;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      box-shadow: 0 8px 22px -8px rgba(120,60,20,.4), inset 0 0 0 1px rgba(178,120,70,.12);
    }

    /* footer */
    .footer { display: flex; flex-direction: column; align-items: center; gap: 38px; }
    .controls { display: flex; align-items: center; gap: 22px; }
    .reset {
      width: 56px; height: 56px; border: none; cursor: pointer; border-radius: 50%;
      background: rgba(255,255,255,.8);
      box-shadow: inset 0 0 0 1px rgba(178,120,70,.2), 0 6px 16px rgba(178,120,70,.1);
      display: flex; align-items: center; justify-content: center; color: #A1632F;
      transition: all .15s ease;
    }
    .reset:hover { background: #fff; color: #FF5A1F; }
    .reset:active { transform: scale(.94); }
    .play {
      width: 96px; height: 96px; border: none; cursor: pointer; border-radius: 50%;
      background: linear-gradient(180deg, #FF9B6D 0%, #FF8357 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 16px 30px -8px rgba(255,90,31,.7), inset 0 1px 0 rgba(255,255,255,.4);
      transition: all .15s ease;
    }
    .play:hover { filter: brightness(1.05); }
    .play:active { transform: scale(.95); }
    .spacer { width: 56px; height: 56px; }

    /* continuous-mode (repeat) chip — a soft toggle chip in the same language
       as the mode pills / round controls, not a formal iOS switch */
    .loop-toggle { cursor: pointer; user-select: none; }
    .loop-toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .loop-chip {
      display: inline-flex; align-items: center; gap: 8px;
      height: 40px; padding: 0 18px; border-radius: 999px;
      background: transparent; color: rgba(120,72,40,.5);
      box-shadow: inset 0 0 0 1.5px rgba(178,120,70,.3);
      transition: all .2s ease;
    }
    .loop-ico { transition: transform .4s cubic-bezier(.34,1.56,.64,1); }
    .loop-label { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
    .loop-toggle:active .loop-chip { transform: scale(.96); }
    /* ON: filled green chip — uses the palette's break-green so it reads clearly
       "on" while giving the all-orange UI some variation */
    .loop-toggle input:checked + .loop-chip {
      background: #7CB342; color: #fff;
      box-shadow: 0 6px 16px -5px rgba(124,179,66,.55), inset 0 0 0 1.5px #7CB342;
    }
    .loop-toggle input:checked + .loop-chip .loop-ico { transform: rotate(180deg); }

    /* hub: small phase word + subtle remaining-minutes number */
    .hubphase { font-size: 11px; font-weight: 700; letter-spacing: .12em; }
    /* translateY corrects the optical lift of digits (empty descender space) */
    .hubmin { font-size: 26px; font-weight: 600; line-height: 1; color: rgba(92,70,52,.4); transform: translateY(1.5px); }

    /* running indicator — a status-LED dot just OUTSIDE the pie rim at the
       lower-right (≈4:30), on the beige, blinking in the current phase colour.
       A soft glow of its own colour makes it read on the light background. Hidden when stopped. */
    .run-dot {
      position: absolute; left: 89%; top: 89%;
      transform: translate(-50%, -50%);
      width: 10px; height: 10px; border-radius: 50%;
      background: currentColor; color: #FF5A1F;
      box-shadow: 0 0 9px 2px currentColor, 0 1px 2px rgba(120,60,20,.35);
      opacity: 0; z-index: 5; pointer-events: none;
    }
    .dial.running .run-dot { animation: runblink 1.1s ease-in-out infinite; }
    @keyframes runblink { 0%, 100% { opacity: 1; } 50% { opacity: .12; } }


    

    /* confirm dialog (mode switch / reset both clear the timer) */
    .confirm {
      display: none; position: fixed; inset: 0; z-index: 80;
      align-items: center; justify-content: center; padding: 26px;
      background: rgba(36,28,22,.34); backdrop-filter: blur(2px);
    }
    .confirm-box {
      width: 100%; max-width: 320px; padding: 24px 22px 18px;
      border-radius: 22px; background: #FFFDFB; text-align: center;
      box-shadow: 0 24px 60px -16px rgba(120,60,20,.5);
    }
    .confirm-msg { font-size: 16px; font-weight: 500; color: #5A3A22; line-height: 1.4; }
    .confirm-actions { display: flex; gap: 10px; margin-top: 20px; }
    .confirm-btn {
      flex: 1; border: none; cursor: pointer; border-radius: 999px; padding: 13px 0;
      font-family: inherit; font-size: 15px; font-weight: 600; transition: filter .15s ease;
    }
    .confirm-btn.cancel { background: rgba(178,120,70,.14); color: #8A5A30; }
    .confirm-btn.ok { background: linear-gradient(180deg, #FF7A3D 0%, #FF5A1F 100%); color: #fff; }
    .confirm-btn:active { filter: brightness(.96); }

    /* custom-timer dialog sliders */
    .slider-row { margin-top: 20px; text-align: left; }
    .slider-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 9px; }
    .slider-head span { font-size: 15px; font-weight: 600; color: #8A5A30; letter-spacing: .02em; }
    .slider-head b { font-size: 23px; font-weight: 700; color: #FF5A1F; }
    .slider-head b::after { content: ' min'; font-size: 12px; font-weight: 600; color: rgba(120,72,40,.5); }
    input[type=range] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 8px; margin: 0;
      border-radius: 999px; background: rgba(178,120,70,.2); outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 26px; height: 26px; border-radius: 50%;
      background: linear-gradient(180deg, #FF7A3D 0%, #FF5A1F 100%); border: 3px solid #fff;
      box-shadow: 0 3px 9px -2px rgba(255,90,31,.7); cursor: pointer;
    }
    input[type=range]::-moz-range-thumb {
      width: 22px; height: 22px; border-radius: 50%; border: 3px solid #fff;
      background: #FF5A1F; box-shadow: 0 3px 9px -2px rgba(255,90,31,.7); cursor: pointer;
    }

    /* help dialog list — large, essentials only */
    .help-list { text-align: left; margin: 18px 0 4px; padding: 0; list-style: none; }
    .help-list li {
      position: relative; font-size: 16px; line-height: 1.55; color: #5A3A22; padding: 7px 0 7px 22px;
    }
    .help-list li::before { content: '•'; position: absolute; left: 4px; color: #FF7A3D; font-weight: 700; }
    #helpDlg .confirm-msg { font-size: 21px; font-weight: 700; }

    /* landscape on phones: lay header · dial · footer side by side and
       size the dial to the available height so nothing gets clipped.
       max-height keeps desktop (tall landscape windows) on the column layout. */
    /* narrow screens (e.g. Galaxy Fold cover display) — shrink so nothing overflows or clips */
    @media (max-width: 380px) {
      .screen { padding: 26px 12px; gap: 28px; }
      .modes { gap: 4px; padding: 4px; }
      .pill { padding: 0 13px; height: 42px; font-size: 13px; }
      .dial { width: min(300px, 90vw); height: min(300px, 90vw); margin-top: 20px; }
      .stem { width: 84px; top: -40px; }
      .controls { gap: 16px; }
    }

    @media (orientation: landscape) and (max-height: 600px) {
      .screen { flex-direction: row; gap: clamp(12px, 2.6vw, 60px); padding: 14px 20px; }
      /* size the dial off the available height (it never shrinks — flex-shrink:0),
         and shrink the surrounding chrome so the header + dial + footer all fit on
         one row without clipping on the short, wide Fold cover display. */
      .dial { width: min(70vh, 280px); height: min(70vh, 280px); margin-top: 0; }
      .header, .footer { gap: 14px; }
      .pill { height: 42px; padding: 0 14px; font-size: 13px; }
      .controls { gap: 16px; }
      .play { width: 80px; height: 80px; }
      .reset, .spacer { width: 50px; height: 50px; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <!-- header: mode chooser (work / break minutes) -->
    <div class="header">
      <div class="modes">
        <button class="pill" id="pillShort">25 / 5</button>
        <button class="pill" id="pillLong">50 / 10</button>
        <button class="pill" id="pillCustom" aria-label="Custom" title="Custom"></button>
      </div>
    </div>

    <!-- dial -->
    <div class="dial">
      <!-- tomato calyx: a little green leafy top + stem so the dial reads as a tomato -->
      <div class="stem" aria-hidden="true">
        <svg viewBox="0 0 64 32" xmlns="http://www.w3.org/2000/svg">
          <!-- simple single-colour sprout: a stem and two wide-splayed leaves,
               floating just above the dial. One flat green, no outline. -->
          <g fill="#7CB342">
            <path d="M32 26 C30 20 34 15 32 7 C34 15 36 20 32 26 Z"/>
            <path d="M31 24 C18 27 7 22 9 16 C18 18 28 21 31 24 Z"/>
            <path d="M33 24 C46 27 57 22 55 16 C46 18 36 21 33 24 Z"/>
          </g>
        </svg>
      </div>
      <div class="glow"></div>
      <div class="ticks"></div>
      <div class="pie" id="pie"></div>
      <div class="hub" id="hub"></div>
      <div class="run-dot" id="runDot" aria-hidden="true"></div>
    </div>

    <!-- footer -->
    <div class="footer">
      <div class="controls">
        <button class="reset" id="resetBtn" title="Reset">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v4.5h4.5"></path></svg>
        </button>
        <button class="play" id="playBtn" title="Start / Pause"></button>
        <button class="reset" id="helpBtn" title="How to use" aria-label="How to use">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 9a2.8 2.8 0 0 1 5.5.8c0 1.9-2.8 2.4-2.8 4"></path><circle cx="12" cy="17.4" r="0.1"></circle></svg>
        </button>
      </div>
      <label class="loop-toggle">
        <input type="checkbox" id="loopChk">
        <span class="loop-chip">
          <svg class="loop-ico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 1l4 4-4 4"></path>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <path d="M7 23l-4-4 4-4"></path>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
          <span class="loop-label">Repeat</span>
        </span>
      </label>
    </div>

    

    <!-- confirm dialog (switching mode / resetting clears the running timer) -->
    <div class="confirm" id="confirm">
      <div class="confirm-box">
        <p class="confirm-msg" id="confirmMsg"></p>
        <div class="confirm-actions">
          <button class="confirm-btn cancel" id="confirmCancel" type="button">Cancel</button>
          <button class="confirm-btn ok" id="confirmOk" type="button">Reset</button>
        </div>
      </div>
    </div>

    <!-- custom timer dialog (sliders) -->
    <div class="confirm" id="customDlg">
      <div class="confirm-box">
        <p class="confirm-msg">Custom timer</p>
        <div class="slider-row">
          <div class="slider-head"><span>Work</span><b id="custWorkVal">30</b></div>
          <input id="custWork" type="range" min="1" max="120" step="1" value="30">
        </div>
        <div class="slider-row">
          <div class="slider-head"><span>Break</span><b id="custBreakVal">10</b></div>
          <input id="custBreak" type="range" min="1" max="60" step="1" value="10">
        </div>
        <div class="confirm-actions">
          <button class="confirm-btn cancel" id="custCancel" type="button">Cancel</button>
          <button class="confirm-btn ok" id="custSave" type="button">Save</button>
        </div>
      </div>
    </div>

    <!-- help / how-to dialog -->
    <div class="confirm" id="helpDlg">
      <div class="confirm-box">
        <p class="confirm-msg">How to use</p>
        <ul class="help-list">
          <li>Pick <b>25/5</b>, <b>50/10</b>, or <b>CUSTOM</b>.</li>
          <li>Play runs work, then the break starts on its own, then stops.</li>
          <li>Orange is work, green is break — the ring drains from the top.</li>
          <li>It buzzes on each switch and keeps the screen awake.</li>
        </ul>
        <div class="confirm-actions">
          <button class="confirm-btn ok" id="helpClose" type="button">Got it</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── glyphs ────────────────────────────────────────────────
    const PLAY = "<svg width='30' height='30' viewBox='0 0 24 24' fill='white'><path d='M7 5v14l12-7z'/></svg>";
    const PAUSE = "<svg width='30' height='30' viewBox='0 0 24 24' fill='white'><rect x='6' y='5' width='4' height='14' rx='1'/><rect x='14' y='5' width='4' height='14' rx='1'/></svg>";
    // pencil glyph for the unset CUSTOM pill — reads as "edit your own", inherits the pill's text colour
    const CUSTOM_ICON = "<svg class='pill-ico' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M17 3a2.83 2.83 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z'/><path d='M15 5l4 4'/></svg>";

    // ── pomodoro logic (ported faithfully from the design source) ──
    const DUR = {
      focus25: { work: 1500, break: 300 },
      deep50:  { work: 3000, break: 600 },
      custom:  { work: 1800, break: 600 },   // default until the user sets one
    };
    // remember the last custom pair across sessions
    let customSet = false;
    try {
      const c = JSON.parse(localStorage.getItem('pomodoro-custom'));
      if (c && c.work > 0 && c.break > 0) { DUR.custom = c; customSet = true; }
    } catch (e) {}
    // continuous mode: cycle work → break → work … instead of stopping after one set
    let loop = false;
    try { loop = localStorage.getItem('pomodoro-loop') === '1'; } catch (e) {}

    // ⚠ TEMP TESTING — MUST BE 1 IN PRODUCTION.
    //    SPEED > 1 runs the clock that many times faster so a minute elapses like a
    //    second (25 min work → 25 s) while the dial still shows minutes. Before
    //    deploying, set SPEED = 1. (A red on-screen banner + console warning appear
    //    whenever SPEED ≠ 1 — see the deploy safeguard near the bottom of this script.)
    const SPEED = 1;
    const msFor    = (secs)   => secs * 1000 / SPEED;              // display-seconds → real ms
    const secsLeft = (target) => (target - Date.now()) / 1000 * SPEED; // real ms left → display-seconds

    const state = { mode: 'focus25', phase: 'work', running: false, remaining: 1500, targetEnd: null, completed: 0 };

    const dur = (mode, phase) => DUR[mode || state.mode][phase || state.phase];

    // ── native bridge (Capacitor APK only; every call no-ops on the web) ──
    // The custom "Pomodoro" plugin provides: scheduleBoundary(at, nextPhase), cancelBoundary().
    // In the APK an exact alarm fires at the phase boundary even while the app
    // is backgrounded, handling vibration + a notification natively.
    const Cap = window.Capacitor;
    const isNative = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
    const Native = isNative && Cap.Plugins ? Cap.Plugins.Pomodoro : null;
    let reconciling = false;    // true while catching up a boundary that elapsed in the background

    function cancelBoundary()        { if (Native) Native.cancelBoundary().catch(() => {}); }
    function scheduleBoundary(at, nextPhase) {
      if (Native && at) Native.scheduleBoundary({ at, nextPhase }).catch(() => {});
    }

    // ── screen wake lock — keep the display on while the timer runs ──
    // Screen Wake Lock API works on Android Chrome and inside the Capacitor
    // WebView. The lock is auto-released when the page is hidden, so we
    // re-acquire it on visibilitychange whenever the timer is still running.
    let wakeLock = null;
    async function requestWakeLock() {
      if (!('wakeLock' in navigator) || wakeLock) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } catch (e) { wakeLock = null; }
    }
    function releaseWakeLock() {
      if (!wakeLock) return;
      try { wakeLock.release(); } catch (e) {}
      wakeLock = null;
    }

    function start() {
      if (state.remaining <= 0) return;
      state.running = true; state.targetEnd = Date.now() + msFor(state.remaining);
      const isWork = state.phase === 'work';
      // focus start: keep screen on and schedule boundary
      requestWakeLock();                                        // running → keep screen on
      scheduleBoundary(state.targetEnd, isWork ? 'break' : 'work');
      render();
    }
    function pause() {
      state.remaining = state.targetEnd ? Math.max(0, secsLeft(state.targetEnd)) : state.remaining;
      state.running = false; state.targetEnd = null;
      cancelBoundary();
      releaseWakeLock();                                        // stopped → allow screen to sleep
      render();
    }
    function toggle() { state.running ? pause() : start(); }
    function reset() {
      state.running = false; state.targetEnd = null; state.remaining = dur();
      cancelBoundary(); releaseWakeLock();
      render();
    }
    function setMode(mode) {
      state.mode = mode; state.phase = 'work'; state.running = false;
      state.targetEnd = null; state.remaining = dur(mode, 'work');
      cancelBoundary(); releaseWakeLock();
      render();
    }

    function tick() {
      if (!state.running || !state.targetEnd) return;
      const rem = secsLeft(state.targetEnd);
      if (rem <= 0) { complete(); return; }
      state.remaining = rem; render();
    }
    // mode-change vibration — distinct patterns for focus vs break.
    // navigator.vibrate works on Android browsers (and the future Capacitor APK
    // falls back to native Vibrator for the background case — see doc/apk-plan.md).
    function buzz(nextPhase) {
      if (!navigator.vibrate) return;
      navigator.vibrate(nextPhase === 'work' ? [400] : [120, 100, 120]);
    }

    function complete() {
      const wasWork = state.phase === 'work';
      const next = wasWork ? 'break' : 'work';
      // When catching up a boundary that already elapsed in the background, the
      // native side (or nobody, on the web) already buzzed — stay silent.
      if (!reconciling) buzz(next);
      const newRem = dur(state.mode, next);
      state.phase = next;
      if (wasWork) state.completed += 1;
      state.remaining = newRem;
      // Roll straight into the break after work. After the break, stop back to
      // standby — unless continuous mode is on, then cycle into the next work.
      state.running = wasWork || loop;
      state.targetEnd = state.running ? Date.now() + msFor(newRem) : null;
      if (state.running) {
        scheduleBoundary(state.targetEnd, state.phase === 'work' ? 'break' : 'work');
        requestWakeLock();                                      // still running → keep screen on
      } else {
        cancelBoundary();                                       // set finished
        releaseWakeLock();                                      // standby → allow screen to sleep
      }
      render();
    }

    // ── render ────────────────────────────────────────────────
    const el = {
      pie: document.getElementById('pie'),
      hub: document.getElementById('hub'),
      dial: document.querySelector('.dial'),
      runDot: document.getElementById('runDot'),
      pillShort: document.getElementById('pillShort'),
      pillLong: document.getElementById('pillLong'),
      pillCustom: document.getElementById('pillCustom'),
      play: document.getElementById('playBtn'),
    };

    function render() {
      const isWork = state.phase === 'work';
      // The whole circle is one set: a big work arc + a small break arc, shown
      // together from the start. The elapsed part of the set drains to the track.
      const workTotal = DUR[state.mode].work;
      const breakTotal = DUR[state.mode].break;
      const setTotal = workTotal + breakTotal;
      const workDeg = workTotal / setTotal * 360;

      // snap remaining to 10-second steps so the wedge updates in responsive jumps
      const remSnap = Math.ceil(Math.max(0, state.remaining) / 10) * 10;
      let consumed = isWork ? (workTotal - remSnap) : (workTotal + (breakTotal - remSnap));
      consumed = Math.max(0, Math.min(setTotal, consumed));
      const consumedDeg = consumed / setTotal * 360;

      // The gradient is built clockwise from the top, then the .pie element is
      // mirrored (scaleX(-1)) so it reads counter-clockwise: the green break
      // slice lands at the top (≈12–2 o'clock) and work drains from the top
      // down the left. Work and break sit flush — no divider gap.
      const workCol  = '#FF5A1F';   // work region (the big orange slice)
      const breakCol = '#7CB342';   // break region (the small green slice)
      const track = 'rgba(178,120,70,.14)';

      const stops = [];
      if (consumedDeg > 0.01) stops.push(`${track} 0deg ${consumedDeg}deg`);            // elapsed
      if (consumedDeg < workDeg) stops.push(`${workCol} ${Math.max(consumedDeg, 0)}deg ${workDeg}deg`); // remaining work
      const bStart = Math.max(consumedDeg, workDeg);
      if (bStart < 360) stops.push(`${breakCol} ${bStart}deg 360deg`);                   // remaining break
      el.pie.style.background = `conic-gradient(from 0deg, ${stops.join(', ')})`;

      const accent = isWork ? workCol : breakCol;
      const mins = Math.max(0, Math.ceil(state.remaining / 60));
      el.hub.innerHTML = `<span class="hubmin" style="color:${accent}">${mins}</span>`;

      el.pillShort.classList.toggle('active', state.mode === 'focus25');
      el.pillLong.classList.toggle('active', state.mode === 'deep50');
      el.pillCustom.classList.toggle('active', state.mode === 'custom');
      el.pillCustom.innerHTML = customSet
        ? `${Math.round(DUR.custom.work / 60)} / ${Math.round(DUR.custom.break / 60)}`
        : CUSTOM_ICON;

      el.play.innerHTML = state.running ? PAUSE : PLAY;

      // running indicator: blink the status-LED dot in the current phase colour
      el.dial.classList.toggle('running', state.running);
      el.runDot.style.color = accent;
    }

    // ── confirm dialog — switching mode or resetting clears a live timer ──
    // Only ask when there's actually progress to lose (running, or partway in).
    function sessionInProgress() { return state.running || state.remaining !== dur(); }
    let pendingConfirm = null;
    const confirmEl = document.getElementById('confirm');
    function askConfirm(msg, okLabel, onYes) {
      document.getElementById('confirmMsg').textContent = msg;
      document.getElementById('confirmOk').textContent = okLabel;
      pendingConfirm = onYes;
      confirmEl.style.display = 'flex';
    }
    function hideConfirm() { confirmEl.style.display = 'none'; pendingConfirm = null; }
    document.getElementById('confirmCancel').addEventListener('click', hideConfirm);
    document.getElementById('confirmOk').addEventListener('click', () => {
      const act = pendingConfirm; hideConfirm(); if (act) act();
    });
    confirmEl.addEventListener('click', (e) => { if (e.target === confirmEl) hideConfirm(); });

    function requestMode(mode) {
      if (mode === state.mode) return;
      if (sessionInProgress()) askConfirm('Switch mode? This resets the timer.', 'Switch', () => setMode(mode));
      else setMode(mode);
    }
    function requestReset() {
      if (!sessionInProgress()) return;
      askConfirm('Reset the timer?', 'Reset', reset);
    }

    // ── custom-timer dialog (sliders) ──
    const customDlg = document.getElementById('customDlg');
    const custWork = document.getElementById('custWork');
    const custBreak = document.getElementById('custBreak');
    const custWorkVal = document.getElementById('custWorkVal');
    const custBreakVal = document.getElementById('custBreakVal');
    custWork.addEventListener('input', () => { custWorkVal.textContent = custWork.value; });
    custBreak.addEventListener('input', () => { custBreakVal.textContent = custBreak.value; });
    function openCustom() {
      custWork.value = Math.round(DUR.custom.work / 60);
      custBreak.value = Math.round(DUR.custom.break / 60);
      custWorkVal.textContent = custWork.value;
      custBreakVal.textContent = custBreak.value;
      customDlg.style.display = 'flex';
    }
    function hideCustom() { customDlg.style.display = 'none'; }
    function saveCustom() {
      const w = Math.min(120, Math.max(1, parseInt(custWork.value, 10) || 1));
      const b = Math.min(60, Math.max(1, parseInt(custBreak.value, 10) || 1));
      DUR.custom = { work: w * 60, break: b * 60 };
      customSet = true;
      try { localStorage.setItem('pomodoro-custom', JSON.stringify(DUR.custom)); } catch (e) {}
      hideCustom();
      setMode('custom');
    }
    document.getElementById('custCancel').addEventListener('click', hideCustom);
    document.getElementById('custSave').addEventListener('click', saveCustom);
    customDlg.addEventListener('click', (e) => { if (e.target === customDlg) hideCustom(); });

    // ── continuous (repeat) mode: keep cycling work → break → work … ──
    const loopChk = document.getElementById('loopChk');
    loopChk.checked = loop;
    loopChk.addEventListener('change', () => {
      loop = loopChk.checked;
      try { localStorage.setItem('pomodoro-loop', loop ? '1' : '0'); } catch (e) {}
    });

    // ── help dialog ──
    const helpDlg = document.getElementById('helpDlg');
    const hideHelp = () => { helpDlg.style.display = 'none'; };
    document.getElementById('helpBtn').addEventListener('click', () => { helpDlg.style.display = 'flex'; });
    document.getElementById('helpClose').addEventListener('click', hideHelp);
    helpDlg.addEventListener('click', (e) => { if (e.target === helpDlg) hideHelp(); });

    el.play.addEventListener('click', toggle);
    document.getElementById('resetBtn').addEventListener('click', requestReset);
    el.pillShort.addEventListener('click', () => requestMode('focus25'));
    el.pillLong.addEventListener('click', () => requestMode('deep50'));
    el.pillCustom.addEventListener('click', openCustom);
    // DND permission UI removed
    setInterval(tick, 200);

    // Keep the timer correct in the background: timekeeping is wall-clock based
    // (targetEnd), so even when the tab is hidden and its interval is throttled,
    // no time is lost. On returning we tick once immediately to refresh the dial
    // and settle any boundary that elapsed while hidden — silently, since the
    // alert (vibration/notification) already fired natively while backgrounded.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      reconciling = true;
      tick();
      reconciling = false;
      if (state.running) requestWakeLock();   // re-acquire: the lock drops when hidden
    });

    render();

    // ⚠ DEPLOY SAFEGUARD: if the clock is still sped up (SPEED ≠ 1), make it
    //    impossible to miss — a red banner + console warning. Setting SPEED = 1
    //    (the production value) removes both automatically.
    if (SPEED !== 1) {
      console.warn(`⚠ Pomodoro TEST MODE: clock runs ${SPEED}× faster (min→sec). Set SPEED = 1 before deploying.`);
      const warn = document.createElement('div');
      warn.textContent = `⚡ TEST MODE ${SPEED}× (min→sec) — set SPEED = 1 before deploy`;
      warn.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:200;text-align:center;'
        + 'font:600 12px Helvetica,Arial,sans-serif;letter-spacing:.03em;color:#fff;'
        + 'background:#C2410C;padding:6px 10px;box-shadow:0 2px 8px rgba(0,0,0,.25);';
      document.body.appendChild(warn);
    }

    // Service worker: register only on the web (PWA/offline). In the native APK
    // assets are local, so a SW only causes stale caches — skip and clear it.
    if ('serviceWorker' in navigator) {
      if (isNative) {
        navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
        if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
      } else {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
      }
    }
  </script>
</body>
</html>
