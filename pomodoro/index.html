<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FCE3D2">
  <meta name="description" content="A minimal pomodoro timer with a warm pie-dial that steps down once a minute. Short (25/5) and long (50/10) focus sessions.">
  <title>Pomodoro Timer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='42' fill='%23FCE3D2'/><circle cx='96' cy='96' r='44' fill='%23FF5A1F'/><path d='M96 96 V48 A48 48 0 0 1 144 96 Z' fill='%23FF7A3D'/><circle cx='96' cy='96' r='14' fill='%23FFFDFB'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='42' fill='%23FCE3D2'/><circle cx='96' cy='96' r='44' fill='%23FF5A1F'/><path d='M96 96 V48 A48 48 0 0 1 144 96 Z' fill='%23FF7A3D'/><circle cx='96' cy='96' r='14' fill='%23FFFDFB'/></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      background: #ECE6DF;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* iOS device frame ─ matches the original mockup */
    .device {
      position: relative;
      width: 402px; height: 874px;
      border-radius: 48px; overflow: hidden;
      background: #F2F2F7;
      box-shadow: 0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12);
      transform-origin: center center;
    }
    .island {
      position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
      width: 126px; height: 37px; border-radius: 24px; background: #000; z-index: 50;
    }
    .statusbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; padding: 21px 30px 19px;
    }
    .statusbar .time {
      flex: 1; font-weight: 600; font-size: 17px; line-height: 22px; color: #000;
    }
    .statusbar .icons { display: flex; align-items: center; gap: 7px; }
    .home {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 60;
      height: 34px; display: flex; justify-content: center; align-items: flex-end;
      padding-bottom: 8px; pointer-events: none;
    }
    .home .bar { width: 139px; height: 5px; border-radius: 100px; background: rgba(0,0,0,0.25); }

    /* screen content */
    .screen {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 48px;
      padding: 74px 26px 54px;
      background: linear-gradient(180deg, #FFF1E6 0%, #FCE3D2 50%, #F6D3BC 100%);
      overflow: hidden;
    }

    /* header: mode chooser */
    .header { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .modes {
      display: flex; gap: 6px; padding: 6px; border-radius: 999px;
      background: rgba(255,255,255,.55);
      box-shadow: inset 0 0 0 1px rgba(178,120,70,.14), 0 6px 18px rgba(178,120,70,.07);
    }
    .pill {
      border: none; cursor: pointer; width: 62px; height: 46px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; transition: all .2s ease;
    }
    .pill.active {
      background: #FFFDFB;
      box-shadow: 0 5px 14px -5px rgba(178,80,30,.4), inset 0 0 0 1px rgba(178,120,70,.1);
    }
    .disc {
      display: block; border-radius: 50%; background: transparent;
      box-shadow: inset 0 0 0 2.4px rgba(176,118,76,.55); transition: all .2s ease;
    }
    .pill.active .disc {
      background: #FF5A1F; box-shadow: 0 2px 6px -1px rgba(255,90,31,.5);
    }
    .disc.s { width: 13px; height: 13px; }
    .disc.l { width: 22px; height: 22px; }

    .dndslot { height: 34px; display: flex; align-items: center; justify-content: center; }
    .dnd {
      display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 50%; background: rgba(36,28,22,.92);
      animation: dndpulse 2.6s ease-in-out infinite;
      box-shadow: 0 6px 16px -4px rgba(36,28,22,.5);
    }
    @keyframes dndpulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

    /* dial */
    .dial { position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; }
    .glow {
      position: absolute; inset: -46px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,138,74,.28) 0%, rgba(255,138,74,0) 68%);
      filter: blur(6px);
    }
    .ticks {
      position: absolute; inset: -14px; border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, rgba(154,91,48,.28) 0deg 0.7deg, transparent 0.7deg 6deg);
      -webkit-mask: radial-gradient(circle, transparent 0 150px, #000 150px 158px, transparent 158px);
      mask: radial-gradient(circle, transparent 0 150px, #000 150px 158px, transparent 158px);
    }
    .pie {
      position: absolute; inset: 0; border-radius: 50%;
      box-shadow: 0 22px 54px -14px rgba(178,80,30,.45), inset 0 0 0 1px rgba(255,255,255,.45);
    }
    .hub {
      position: relative; width: 78px; height: 78px; border-radius: 50%; background: #FFFDFB;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 22px -8px rgba(120,60,20,.4), inset 0 0 0 1px rgba(178,120,70,.12);
    }

    /* footer */
    .footer { display: flex; flex-direction: column; align-items: center; gap: 26px; }
    .controls { display: flex; align-items: center; gap: 22px; }
    .reset {
      width: 56px; height: 56px; border: none; cursor: pointer; border-radius: 50%;
      background: rgba(255,255,255,.8);
      box-shadow: inset 0 0 0 1px rgba(178,120,70,.2), 0 6px 16px rgba(178,120,70,.1);
      display: flex; align-items: center; justify-content: center; color: #A1632F;
      transition: all .15s ease;
    }
    .reset:hover { background: #fff; color: #FF5A1F; }
    .reset:active { transform: scale(.94); }
    .play {
      width: 80px; height: 80px; border: none; cursor: pointer; border-radius: 50%;
      background: linear-gradient(180deg, #FF7A3D 0%, #FF5A1F 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 16px 30px -8px rgba(255,90,31,.7), inset 0 1px 0 rgba(255,255,255,.4);
      transition: all .15s ease;
    }
    .play:hover { filter: brightness(1.05); }
    .play:active { transform: scale(.95); }
    .spacer { width: 56px; height: 56px; }

    .dots { display: flex; align-items: center; gap: 13px; }
    .dot {
      width: 9px; height: 9px; border-radius: 50%; background: rgba(178,120,70,.22);
    }
    .dot.filled { background: #FF5A1F; box-shadow: 0 0 0 3px rgba(255,90,31,.16); }
  </style>
</head>
<body>
  <div class="device" id="device">
    <div class="island"></div>
    <div class="statusbar">
      <span class="time">9:41</span>
      <span class="icons">
        <svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill="#000"/><rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill="#000"/><rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill="#000"/><rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill="#000"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill="#000"/><path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill="#000"/><circle cx="8.5" cy="10.5" r="1.5" fill="#000"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="#000" stroke-opacity="0.35" fill="none"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#000"/><path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill="#000" fill-opacity="0.4"/></svg>
      </span>
    </div>

    <div class="screen">
      <!-- header: mode chooser (small disc = short, large disc = long) -->
      <div class="header">
        <div class="modes">
          <button class="pill" id="pillShort" title="Short (25 / 5)"><span class="disc s"></span></button>
          <button class="pill" id="pillLong" title="Long (50 / 10)"><span class="disc l"></span></button>
        </div>
        <div class="dndslot">
          <div class="dnd" id="dnd" style="display:none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="#FFC79E"/></svg>
          </div>
        </div>
      </div>

      <!-- dial -->
      <div class="dial">
        <div class="glow"></div>
        <div class="ticks"></div>
        <div class="pie" id="pie"></div>
        <div class="hub" id="hub"></div>
      </div>

      <!-- footer -->
      <div class="footer">
        <div class="controls">
          <button class="reset" id="resetBtn" title="Reset">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v4.5h4.5"></path></svg>
          </button>
          <button class="play" id="playBtn" title="Start / Pause"></button>
          <div class="spacer"></div>
        </div>
        <div class="dots" id="dots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      </div>
    </div>

    <div class="home"><div class="bar"></div></div>
  </div>

  <script>
    // ── glyphs ────────────────────────────────────────────────
    const SUN = "<svg width='30' height='30' viewBox='0 0 24 24'><circle cx='12' cy='12' r='5.5' fill='#FF5A1F'/><g stroke='#FF5A1F' stroke-width='2' stroke-linecap='round'><line x1='12' y1='1.5' x2='12' y2='4'/><line x1='12' y1='20' x2='12' y2='22.5'/><line x1='1.5' y1='12' x2='4' y2='12'/><line x1='20' y1='12' x2='22.5' y2='12'/><line x1='4.4' y1='4.4' x2='6.1' y2='6.1'/><line x1='17.9' y1='17.9' x2='19.6' y2='19.6'/><line x1='19.6' y1='4.4' x2='17.9' y2='6.1'/><line x1='6.1' y1='17.9' x2='4.4' y2='19.6'/></g></svg>";
    const MOON = "<svg width='28' height='28' viewBox='0 0 24 24' fill='none'><path d='M20 13.5A8 8 0 1 1 10.5 4a6.2 6.2 0 0 0 9.5 9.5Z' fill='#E0912F'/></svg>";
    const PLAY = "<svg width='24' height='24' viewBox='0 0 24 24' fill='white'><path d='M7 5v14l12-7z'/></svg>";
    const PAUSE = "<svg width='24' height='24' viewBox='0 0 24 24' fill='white'><rect x='6' y='5' width='4' height='14' rx='1'/><rect x='14' y='5' width='4' height='14' rx='1'/></svg>";

    // ── pomodoro logic (ported faithfully from the design source) ──
    const DUR = { focus25: { work: 1500, break: 300 }, deep50: { work: 3000, break: 600 } };
    const SOUND_ENABLED = true;   // editor prop in the original; on by default
    const AUTO_START_NEXT = false; // editor prop in the original; off by default

    const state = { mode: 'focus25', phase: 'work', running: false, remaining: 1500, targetEnd: null, completed: 0 };
    let ac = null;

    const dur = (mode, phase) => DUR[mode || state.mode][phase || state.phase];

    function ensureAudio() {
      if (ac) return;
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    function chime() {
      if (!SOUND_ENABLED || !ac) return;
      const now = ac.currentTime;
      [880, 1320, 1760].forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = f;
        o.connect(g); g.connect(ac.destination);
        const t = now + i * 0.16;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
        o.start(t); o.stop(t + 0.5);
      });
    }

    function start() {
      if (state.remaining <= 0) return;
      ensureAudio();
      if (ac && ac.state === 'suspended') ac.resume();
      state.running = true; state.targetEnd = Date.now() + state.remaining * 1000;
      render();
    }
    function pause() {
      state.remaining = state.targetEnd ? Math.max(0, (state.targetEnd - Date.now()) / 1000) : state.remaining;
      state.running = false; state.targetEnd = null;
      render();
    }
    function toggle() { state.running ? pause() : start(); }
    function reset() { state.running = false; state.targetEnd = null; state.remaining = dur(); render(); }
    function setMode(mode) {
      state.mode = mode; state.phase = 'work'; state.running = false;
      state.targetEnd = null; state.remaining = dur(mode, 'work');
      render();
    }

    function tick() {
      if (!state.running || !state.targetEnd) return;
      const rem = (state.targetEnd - Date.now()) / 1000;
      if (rem <= 0) { complete(); return; }
      state.remaining = rem; render();
    }
    function complete() {
      chime();
      const wasWork = state.phase === 'work';
      const next = wasWork ? 'break' : 'work';
      const newRem = dur(state.mode, next);
      state.phase = next;
      if (wasWork) state.completed += 1;
      state.remaining = newRem;
      state.running = AUTO_START_NEXT;
      state.targetEnd = AUTO_START_NEXT ? Date.now() + newRem * 1000 : null;
      render();
    }

    // ── render ────────────────────────────────────────────────
    const el = {
      pie: document.getElementById('pie'),
      hub: document.getElementById('hub'),
      dnd: document.getElementById('dnd'),
      pillShort: document.getElementById('pillShort'),
      pillLong: document.getElementById('pillLong'),
      play: document.getElementById('playBtn'),
      dots: document.getElementById('dots'),
    };

    function render() {
      const isWork = state.phase === 'work';
      const total = dur();
      // snap the wedge to whole minutes so it steps down once a minute — calmer
      const minsLeft = Math.ceil(state.remaining / 60);
      const totalMins = total / 60;
      const frac = Math.max(0, Math.min(1, minsLeft / totalMins));
      const deg = frac * 360;
      const accent = isWork ? '#FF5A1F' : '#F2A33C';
      const accent2 = isWork ? '#FF7A3D' : '#FFC061';
      const track = 'rgba(178,120,70,.14)';
      el.pie.style.background = `conic-gradient(from 0deg, ${accent2} 0deg, ${accent} ${deg}deg, ${track} ${deg}deg 360deg)`;

      el.hub.innerHTML = isWork ? SUN : MOON;

      el.pillShort.classList.toggle('active', state.mode === 'focus25');
      el.pillLong.classList.toggle('active', state.mode === 'deep50');

      el.dnd.style.display = (isWork && state.running) ? 'flex' : 'none';
      el.play.innerHTML = state.running ? PAUSE : PLAY;

      const filled = state.completed === 0 ? 0 : (state.completed % 4 === 0 ? 4 : state.completed % 4);
      [...el.dots.children].forEach((d, i) => d.classList.toggle('filled', i < filled));
    }

    el.play.addEventListener('click', toggle);
    document.getElementById('resetBtn').addEventListener('click', reset);
    el.pillShort.addEventListener('click', () => setMode('focus25'));
    el.pillLong.addEventListener('click', () => setMode('deep50'));
    setInterval(tick, 200);
    render();

    // ── fit the fixed 402×874 frame to the viewport ───────────
    const device = document.getElementById('device');
    function fit() {
      const m = 24;
      const s = Math.min(1, (window.innerWidth - m) / 402, (window.innerHeight - m) / 874);
      device.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();

    // service worker (PWA / offline)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
