<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FCE3D2">
  <meta name="description" content="A minimal pomodoro timer with a warm pie-dial that steps down every ten seconds. Short (25/5) and long (50/10) focus sessions.">
  <title>Pomodoro Timer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='42' fill='%23FCE3D2'/><circle cx='96' cy='96' r='44' fill='%23FF5A1F'/><path d='M96 96 V48 A48 48 0 0 1 144 96 Z' fill='%23FF7A3D'/><circle cx='96' cy='96' r='14' fill='%23FFFDFB'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='42' fill='%23FCE3D2'/><circle cx='96' cy='96' r='44' fill='%23FF5A1F'/><path d='M96 96 V48 A48 48 0 0 1 144 96 Z' fill='%23FF7A3D'/><circle cx='96' cy='96' r='14' fill='%23FFFDFB'/></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* full-bleed screen */
    .screen {
      min-height: 100vh; width: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 48px;
      padding: 48px 26px;
      background: linear-gradient(180deg, #FFF1E6 0%, #FCE3D2 50%, #F6D3BC 100%);
      overflow: hidden;
    }

    /* header: mode chooser */
    .header { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .modes {
      display: flex; gap: 6px; padding: 6px; border-radius: 999px;
      background: rgba(255,255,255,.55);
      box-shadow: inset 0 0 0 1px rgba(178,120,70,.14), 0 6px 18px rgba(178,120,70,.07);
    }
    .pill {
      border: none; cursor: pointer; padding: 0 22px; height: 48px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: .02em;
      color: rgba(120,72,40,.6);
      background: transparent; transition: all .2s ease;
    }
    .pill.active {
      background: #FFFDFB; color: #FF5A1F;
      box-shadow: 0 5px 14px -5px rgba(178,80,30,.4), inset 0 0 0 1px rgba(178,120,70,.1);
    }

    /* dial */
    .dial { position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; }
    .glow {
      position: absolute; inset: -46px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,138,74,.28) 0%, rgba(255,138,74,0) 68%);
      filter: blur(6px);
    }
    .ticks {
      position: absolute; inset: -14px; border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, rgba(154,91,48,.28) 0deg 0.7deg, transparent 0.7deg 6deg);
      /* % radii so the tick ring scales with the dial in any orientation */
      -webkit-mask: radial-gradient(circle, transparent 0 91.5%, #000 91.5% 96.3%, transparent 96.3%);
      mask: radial-gradient(circle, transparent 0 91.5%, #000 91.5% 96.3%, transparent 96.3%);
    }
    .pie {
      position: absolute; inset: 0; border-radius: 50%;
      box-shadow: 0 22px 54px -14px rgba(178,80,30,.45), inset 0 0 0 1px rgba(255,255,255,.45);
    }
    .hub {
      position: relative; width: 78px; height: 78px; border-radius: 50%; background: #FFFDFB;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      box-shadow: 0 8px 22px -8px rgba(120,60,20,.4), inset 0 0 0 1px rgba(178,120,70,.12);
    }

    /* footer */
    .footer { display: flex; flex-direction: column; align-items: center; gap: 26px; }
    .controls { display: flex; align-items: center; gap: 22px; }
    .reset {
      width: 56px; height: 56px; border: none; cursor: pointer; border-radius: 50%;
      background: rgba(255,255,255,.8);
      box-shadow: inset 0 0 0 1px rgba(178,120,70,.2), 0 6px 16px rgba(178,120,70,.1);
      display: flex; align-items: center; justify-content: center; color: #A1632F;
      transition: all .15s ease;
    }
    .reset:hover { background: #fff; color: #FF5A1F; }
    .reset:active { transform: scale(.94); }
    .play {
      width: 96px; height: 96px; border: none; cursor: pointer; border-radius: 50%;
      background: linear-gradient(180deg, #FF7A3D 0%, #FF5A1F 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 16px 30px -8px rgba(255,90,31,.7), inset 0 1px 0 rgba(255,255,255,.4);
      transition: all .15s ease;
    }
    .play:hover { filter: brightness(1.05); }
    .play:active { transform: scale(.95); }
    .spacer { width: 56px; height: 56px; }

    /* hub: small phase word + subtle remaining-minutes number */
    .hubphase { font-size: 11px; font-weight: 700; letter-spacing: .12em; }
    .hubmin { font-size: 26px; font-weight: 600; line-height: 1; color: rgba(92,70,52,.4); }

    /* toned-down mode label */
    .modelabel {
      font-size: 17px; letter-spacing: .03em; font-weight: 500;
      color: rgba(120,72,40,.55);
    }

    /* DND permission banner (APK only; hidden until access is missing) */
    .permbanner {
      display: none; position: fixed; left: 16px; right: 16px; bottom: 18px; z-index: 50;
      align-items: center; gap: 12px; padding: 13px 16px; border-radius: 16px;
      background: rgba(36,28,22,.92); color: #FFE9D8;
      box-shadow: 0 10px 28px -8px rgba(36,28,22,.5);
      font-size: 14px; line-height: 1.35;
    }
    .permbanner span { flex: 1; }
    .permbanner button {
      flex: none; border: none; cursor: pointer; border-radius: 999px;
      padding: 9px 16px; font-size: 14px; font-weight: 600;
      font-family: inherit; color: #fff;
      background: linear-gradient(180deg, #FF7A3D 0%, #FF5A1F 100%);
    }

    /* confirm dialog (mode switch / reset both clear the timer) */
    .confirm {
      display: none; position: fixed; inset: 0; z-index: 80;
      align-items: center; justify-content: center; padding: 26px;
      background: rgba(36,28,22,.34); backdrop-filter: blur(2px);
    }
    .confirm-box {
      width: 100%; max-width: 320px; padding: 24px 22px 18px;
      border-radius: 22px; background: #FFFDFB; text-align: center;
      box-shadow: 0 24px 60px -16px rgba(120,60,20,.5);
    }
    .confirm-msg { font-size: 16px; font-weight: 500; color: #5A3A22; line-height: 1.4; }
    .confirm-actions { display: flex; gap: 10px; margin-top: 20px; }
    .confirm-btn {
      flex: 1; border: none; cursor: pointer; border-radius: 999px; padding: 13px 0;
      font-family: inherit; font-size: 15px; font-weight: 600; transition: filter .15s ease;
    }
    .confirm-btn.cancel { background: rgba(178,120,70,.14); color: #8A5A30; }
    .confirm-btn.ok { background: linear-gradient(180deg, #FF7A3D 0%, #FF5A1F 100%); color: #fff; }
    .confirm-btn:active { filter: brightness(.96); }

    /* landscape on phones: lay header · dial · footer side by side and
       size the dial to the available height so nothing gets clipped.
       max-height keeps desktop (tall landscape windows) on the column layout. */
    @media (orientation: landscape) and (max-height: 600px) {
      .screen { flex-direction: row; gap: clamp(24px, 5vw, 60px); padding: 18px 30px; }
      .dial { width: min(80vh, 300px); height: min(80vh, 300px); }
      .header, .footer { gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <!-- header: mode chooser (work / break minutes) -->
    <div class="header">
      <div class="modes">
        <button class="pill" id="pillShort">25 / 5</button>
        <button class="pill" id="pillLong">50 / 10</button>
      </div>
      <div class="modelabel" id="modeLabel"></div>
    </div>

    <!-- dial -->
    <div class="dial">
      <div class="glow"></div>
      <div class="ticks"></div>
      <div class="pie" id="pie"></div>
      <div class="hub" id="hub"></div>
    </div>

    <!-- footer -->
    <div class="footer">
      <div class="controls">
        <button class="reset" id="resetBtn" title="Reset">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v4.5h4.5"></path></svg>
        </button>
        <button class="play" id="playBtn" title="Start / Pause"></button>
        <div class="spacer"></div>
      </div>
    </div>

    <!-- DND access prompt (native APK only) -->
    <div class="permbanner" id="permBanner">
      <span>Allow Do Not Disturb access so focus sessions can silence notifications.</span>
      <button id="permBtn" type="button">Allow</button>
    </div>

    <!-- confirm dialog (switching mode / resetting clears the running timer) -->
    <div class="confirm" id="confirm">
      <div class="confirm-box">
        <p class="confirm-msg" id="confirmMsg"></p>
        <div class="confirm-actions">
          <button class="confirm-btn cancel" id="confirmCancel" type="button">Cancel</button>
          <button class="confirm-btn ok" id="confirmOk" type="button">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── glyphs ────────────────────────────────────────────────
    const PLAY = "<svg width='30' height='30' viewBox='0 0 24 24' fill='white'><path d='M7 5v14l12-7z'/></svg>";
    const PAUSE = "<svg width='30' height='30' viewBox='0 0 24 24' fill='white'><rect x='6' y='5' width='4' height='14' rx='1'/><rect x='14' y='5' width='4' height='14' rx='1'/></svg>";

    // ── pomodoro logic (ported faithfully from the design source) ──
    const DUR = { focus25: { work: 1500, break: 300 }, deep50: { work: 3000, break: 600 } };
    const SOUND_ENABLED = true;   // editor prop in the original; on by default
    const AUTO_START_NEXT = false; // editor prop in the original; off by default

    const state = { mode: 'focus25', phase: 'work', running: false, remaining: 1500, targetEnd: null, completed: 0 };
    let ac = null;

    const dur = (mode, phase) => DUR[mode || state.mode][phase || state.phase];

    // ── native bridge (Capacitor APK only; every call no-ops on the web) ──
    // The custom "Pomodoro" plugin provides: hasDndAccess / requestDndAccess,
    // setDnd(enabled), scheduleBoundary(at, nextPhase), cancelBoundary().
    // In the APK an exact alarm fires at the phase boundary even while the app
    // is backgrounded, handling vibration + DND + a notification natively.
    const Cap = window.Capacitor;
    const isNative = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
    const Native = isNative && Cap.Plugins ? Cap.Plugins.Pomodoro : null;
    let askedDnd = false;       // only prompt for DND access once per session
    let reconciling = false;    // true while catching up a boundary that elapsed in the background

    function applyDnd(on)            { if (Native) Native.setDnd({ enabled: on }).catch(() => {}); }
    function cancelBoundary()        { if (Native) Native.cancelBoundary().catch(() => {}); }
    function scheduleBoundary(at, nextPhase) {
      if (Native && at) Native.scheduleBoundary({ at, nextPhase }).catch(() => {});
    }
    async function ensureDndAccess() {
      if (!Native || askedDnd) return;
      askedDnd = true;
      try {
        const res = await Native.hasDndAccess();
        if (!res || !res.granted) showPermBanner();
      } catch (e) {}
    }
    function showPermBanner() {
      const b = document.getElementById('permBanner');
      if (b) b.style.display = 'flex';
    }

    // ── screen wake lock — keep the display on while the timer runs ──
    // Screen Wake Lock API works on Android Chrome and inside the Capacitor
    // WebView. The lock is auto-released when the page is hidden, so we
    // re-acquire it on visibilitychange whenever the timer is still running.
    let wakeLock = null;
    async function requestWakeLock() {
      if (!('wakeLock' in navigator) || wakeLock) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } catch (e) { wakeLock = null; }
    }
    function releaseWakeLock() {
      if (!wakeLock) return;
      try { wakeLock.release(); } catch (e) {}
      wakeLock = null;
    }

    function ensureAudio() {
      if (ac) return;
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    function chime() {
      if (!SOUND_ENABLED || !ac) return;
      const now = ac.currentTime;
      [880, 1320, 1760].forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = f;
        o.connect(g); g.connect(ac.destination);
        const t = now + i * 0.16;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
        o.start(t); o.stop(t + 0.5);
      });
    }

    function start() {
      if (state.remaining <= 0) return;
      ensureAudio();
      if (ac && ac.state === 'suspended') ac.resume();
      state.running = true; state.targetEnd = Date.now() + state.remaining * 1000;
      const isWork = state.phase === 'work';
      if (isWork) ensureDndAccess();
      applyDnd(isWork);                                         // focus → DND on
      requestWakeLock();                                        // running → keep screen on
      scheduleBoundary(state.targetEnd, isWork ? 'break' : 'work');
      render();
    }
    function pause() {
      state.remaining = state.targetEnd ? Math.max(0, (state.targetEnd - Date.now()) / 1000) : state.remaining;
      state.running = false; state.targetEnd = null;
      applyDnd(false); cancelBoundary();                       // stopping → release DND
      releaseWakeLock();                                        // stopped → allow screen to sleep
      render();
    }
    function toggle() { state.running ? pause() : start(); }
    function reset() {
      state.running = false; state.targetEnd = null; state.remaining = dur();
      applyDnd(false); cancelBoundary(); releaseWakeLock();
      render();
    }
    function setMode(mode) {
      state.mode = mode; state.phase = 'work'; state.running = false;
      state.targetEnd = null; state.remaining = dur(mode, 'work');
      applyDnd(false); cancelBoundary(); releaseWakeLock();
      render();
    }

    function tick() {
      if (!state.running || !state.targetEnd) return;
      const rem = (state.targetEnd - Date.now()) / 1000;
      if (rem <= 0) { complete(); return; }
      state.remaining = rem; render();
    }
    // mode-change vibration — distinct patterns for focus vs break.
    // navigator.vibrate works on Android browsers (and the future Capacitor APK
    // falls back to native Vibrator for the background case — see doc/apk-plan.md).
    function buzz(nextPhase) {
      if (!navigator.vibrate) return;
      navigator.vibrate(nextPhase === 'work' ? [400] : [120, 100, 120]);
    }

    function complete() {
      const wasWork = state.phase === 'work';
      const next = wasWork ? 'break' : 'work';
      // When catching up a boundary that already elapsed in the background, the
      // native side (or nobody, on the web) already alerted — stay silent.
      if (!reconciling) { chime(); buzz(next); }
      const newRem = dur(state.mode, next);
      state.phase = next;
      if (wasWork) state.completed += 1;
      state.remaining = newRem;
      state.running = AUTO_START_NEXT;
      state.targetEnd = AUTO_START_NEXT ? Date.now() + newRem * 1000 : null;
      applyDnd(state.running && state.phase === 'work');        // break → off; auto work → on
      if (state.running) {
        scheduleBoundary(state.targetEnd, state.phase === 'work' ? 'break' : 'work');
        requestWakeLock();                                      // auto-started next phase → keep screen on
      } else {
        cancelBoundary();                                       // alarm already consumed
        releaseWakeLock();                                      // idle between phases → allow sleep
      }
      render();
    }

    // ── render ────────────────────────────────────────────────
    const el = {
      pie: document.getElementById('pie'),
      hub: document.getElementById('hub'),
      pillShort: document.getElementById('pillShort'),
      pillLong: document.getElementById('pillLong'),
      play: document.getElementById('playBtn'),
      modeLabel: document.getElementById('modeLabel'),
    };

    function render() {
      const isWork = state.phase === 'work';
      const total = dur();
      // snap the wedge to 10-second steps so it updates more responsively
      const stepsLeft = Math.ceil(state.remaining / 10);
      const totalSteps = total / 10;
      const frac = Math.max(0, Math.min(1, stepsLeft / totalSteps));
      const deg = frac * 360;
      const accent = isWork ? '#FF5A1F' : '#F2A33C';
      const accent2 = isWork ? '#FF7A3D' : '#FFC061';
      const track = 'rgba(178,120,70,.14)';
      el.pie.style.background = `conic-gradient(from 0deg, ${accent2} 0deg, ${accent} ${deg}deg, ${track} ${deg}deg 360deg)`;

      const mins = Math.max(0, Math.ceil(state.remaining / 60));
      el.hub.innerHTML =
        `<span class="hubphase" style="color:${accent}">${isWork ? 'WORK' : 'BREAK'}</span>` +
        `<span class="hubmin">${mins}</span>`;

      el.pillShort.classList.toggle('active', state.mode === 'focus25');
      el.pillLong.classList.toggle('active', state.mode === 'deep50');

      el.play.innerHTML = state.running ? PAUSE : PLAY;

      el.modeLabel.textContent = state.mode === 'focus25'
        ? 'Work 25 · Break 5'
        : 'Work 50 · Break 10';
    }

    // ── confirm dialog — switching mode or resetting clears a live timer ──
    // Only ask when there's actually progress to lose (running, or partway in).
    function sessionInProgress() { return state.running || state.remaining !== dur(); }
    let pendingConfirm = null;
    const confirmEl = document.getElementById('confirm');
    function askConfirm(msg, okLabel, onYes) {
      document.getElementById('confirmMsg').textContent = msg;
      document.getElementById('confirmOk').textContent = okLabel;
      pendingConfirm = onYes;
      confirmEl.style.display = 'flex';
    }
    function hideConfirm() { confirmEl.style.display = 'none'; pendingConfirm = null; }
    document.getElementById('confirmCancel').addEventListener('click', hideConfirm);
    document.getElementById('confirmOk').addEventListener('click', () => {
      const act = pendingConfirm; hideConfirm(); if (act) act();
    });
    confirmEl.addEventListener('click', (e) => { if (e.target === confirmEl) hideConfirm(); });

    function requestMode(mode) {
      if (mode === state.mode) return;
      if (sessionInProgress()) askConfirm('Switch mode? This resets the timer.', 'Switch', () => setMode(mode));
      else setMode(mode);
    }
    function requestReset() {
      if (!sessionInProgress()) return;
      askConfirm('Reset the timer?', 'Reset', reset);
    }

    el.play.addEventListener('click', toggle);
    document.getElementById('resetBtn').addEventListener('click', requestReset);
    el.pillShort.addEventListener('click', () => requestMode('focus25'));
    el.pillLong.addEventListener('click', () => requestMode('deep50'));
    document.getElementById('permBtn').addEventListener('click', () => {
      if (Native) Native.requestDndAccess().catch(() => {});
      document.getElementById('permBanner').style.display = 'none';
    });
    setInterval(tick, 200);

    // Keep the timer correct in the background: timekeeping is wall-clock based
    // (targetEnd), so even when the tab is hidden and its interval is throttled,
    // no time is lost. On returning we tick once immediately to refresh the dial
    // and settle any boundary that elapsed while hidden — silently, since the
    // alert (vibration/notification) already fired natively while backgrounded.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      reconciling = true;
      tick();
      reconciling = false;
      if (state.running) requestWakeLock();   // re-acquire: the lock drops when hidden
    });

    render();

    // Service worker: register only on the web (PWA/offline). In the native APK
    // assets are local, so a SW only causes stale caches — skip and clear it.
    if ('serviceWorker' in navigator) {
      if (isNative) {
        navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
        if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
      } else {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
      }
    }
  </script>
</body>
</html>
