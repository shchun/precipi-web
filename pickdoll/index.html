<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#251b31" />
    <meta
      name="description"
      content="반짝이는 핑크 인형뽑기. 집게를 움직이고 회전해 일곱 인형을 모아보세요."
    />
    <title>PickDoll · 인형뽑기</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="game">
      <header>
        <a href="../" aria-label="Precipi 첫 페이지">Precipi</a>
        <h1>PickDoll</h1>
        <span id="score" aria-live="polite">0 / 7</span>
      </header>
      <div id="viewport" aria-label="인형뽑기 3D 화면"></div>
      <div class="top-controls">
        <select id="camera" aria-label="카메라 시점">
          <option value="0">정면</option>
          <option value="1">위에서</option>
          <option value="2">왼쪽</option>
          <option value="3">오른쪽</option>
          <option value="4">뒤에서</option></select
        ><button id="sound" aria-pressed="true">소리 켜짐</button
        ><button id="reset">새 판</button
        ><button id="help" aria-label="조작 안내" aria-expanded="false">
          ?
        </button>
      </div>
      <p id="status" role="status">인형뽑기를 준비하고 있어요…</p>
      <aside id="instructions" hidden>
        방향키로 이동 · Shift로 천천히 · Ctrl + 방향키로 1mm 이동<br />Z / X로
        회전 · Enter로 뽑기 · Tab / 1~5로 카메라<br />R로 새 판 · M으로 소리<br />휴대폰에서는
        방향키를 길게 눌러 움직이고, 미세 이동을 켜면 한 번에 1mm씩 움직여요.
      </aside>
      <section id="controls" aria-label="게임 조작">
        <div class="movement">
          <div class="dpad">
            <button data-move="up" aria-label="위로 이동">↑</button
            ><button data-move="left" aria-label="왼쪽으로 이동">←</button
            ><button data-move="down" aria-label="아래로 이동">↓</button
            ><button data-move="right" aria-label="오른쪽으로 이동">→</button>
          </div>
          <button id="fine" aria-pressed="false">미세 이동</button>
        </div>
        <div class="actions">
          <div class="rotation">
            <button data-rotate="-1" aria-label="집게 왼쪽 회전">↶ 회전</button
            ><button data-rotate="1" aria-label="집게 오른쪽 회전">
              회전 ↷
            </button>
          </div>
          <button id="pick" disabled>뽑기</button>
        </div>
      </section>
      <div id="welcome" class="veil">
        <div class="welcome-card">
          <span class="toy">✦</span>
          <h2>오늘은 어떤 인형을<br />데려갈까요?</h2>
          <p id="loading">집게와 일곱 인형을 준비하고 있어요.</p>
          <button id="start" disabled>준비 중…</button>
          <p class="small">방향을 맞추고, 각도를 돌리고, 뽑기.</p>
        </div>
      </div>
    </main>
    <script type="module" src="app.js?v=studio-4"></script>
  </body>
</html>
