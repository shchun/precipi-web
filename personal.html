<!DOCTYPE html>
<html lang="ko" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 개인용 페이지 — 검색엔진 색인 제외 -->
  <meta name="robots" content="noindex,nofollow">
  <title>Precipi · Personal</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <div class="logo-badge">
          <span class="brand">precipi<span class="tld">.com</span></span>
          <span class="orbit"><span class="orbit-dot"></span></span>
        </div>
      </div>
      <p class="tagline">🔒 개인용 · Personal</p>
    </div>

    <div class="demos-grid">
      <a href="https://tango.precipi.com/" class="demo-card">
        <h2 class="card-title">📖 単語帳 Tango</h2>
        <p class="card-desc">일본어 단어장 PWA. Google Sheets를 백엔드로 단어 추가·검색·중요 마킹·히스토리, 한 장씩 외우는 외우기 모드 지원. Hermes로 자연어 추가 가능.</p>
        <span class="path">tango.precipi.com</span>
      </a>

      <a href="https://chat.precipi.com/" class="demo-card">
        <h2 class="card-title">🤖 Hermes 개인비서</h2>
        <p class="card-desc">옵시디언 볼트·맛집·단어장을 검색하고 기록하는 개인 비서. 텍스트·음성(푸시투토크) 채팅 PWA. Slack에서도 동작.</p>
        <span class="path">chat.precipi.com</span>
      </a>
    </div>
  </div>
</body>
</html>
